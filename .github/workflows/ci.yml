name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign the Windows release with the protected release environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      # PySide6 links libEGL at import; the runner image does not ship it, so
      # importing QtWidgets fails before any test runs.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: pip install --require-hashes -r requirements/dev.txt

      # No game install on CI: fixtures are built from the format spec, and
      # tests needing real data skip themselves.  Keep the long-lived Qt app
      # and screenshot subprocesses in separate pytest processes so platform
      # plugin teardown cannot retain a worker at suite shutdown.
      - name: Test core
        run: pytest -q --ignore=tests/test_gui.py --ignore=tests/test_gui_screenshots.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test shared Qt lifecycle
        run: pytest -vv -s tests/test_gui.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test high-DPI screenshots
        run: pytest -q tests/test_gui_screenshots.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Reject unreviewed network-capable imports
        run: python packaging/verify_network_surface.py

      - name: Verify bounded P4K streaming resources
        run: python -m benchmarks.p4k_streaming
        env:
          PYTHONPATH: src

      - name: Verify adversarial C4 ownership scanning
        run: python -m benchmarks.ownership_adversarial --megabytes 128
        env:
          PYTHONPATH: src

      - name: Confirm no game data is committed
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(global|stock-global|rendered|cache)\.(ini|json)$|(^|/)(scmdb|owned-items)[^/]*\.(json|csv)$|\.(p4k|dcb)$|tests/samples/.*\.ini$'; then
            echo "::error::game data, generated output, or player data must not be committed"
            exit 1
          fi

  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/tools.txt

      - name: Install locked audit tools
        run: pip install --require-hashes -r requirements/tools.txt

      - name: Audit every dependency surface
        run: |
          pip-audit --require-hashes --progress-spinner off -r requirements/runtime.txt
          pip-audit --require-hashes --progress-spinner off -r requirements/dev.txt
          pip-audit --require-hashes --progress-spinner off -r requirements/build.txt
          pip-audit --require-hashes --progress-spinner off -r requirements/tools.txt

      - name: Regenerate and validate runtime SBOM
        run: |
          cyclonedx-py requirements requirements/runtime.txt --pyproject pyproject.toml --mc-type application --sv 1.6 --output-reproducible --of JSON --output-file sbom/starcompanion-runtime.cdx.json
          python packaging/finalize_sbom.py sbom/starcompanion-runtime.cdx.json
          python packaging/verify_sbom.py sbom/starcompanion-runtime.cdx.json
          git diff --exit-code -- sbom/starcompanion-runtime.cdx.json

  build-windows:
    needs: [test, supply-chain]
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
      signing-version: ${{ steps.version.outputs.signing-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/build.txt

      - name: Download hash-verified release wheelhouse
        run: |
          pip download --require-hashes --only-binary=:all: --dest build\wheelhouse -r requirements\build.txt

      - name: Prove release dependencies install without an index
        run: |
          python -m venv build\offline-build
          .\build\offline-build\Scripts\pip.exe install --no-index --find-links build\wheelhouse --require-hashes -r requirements\build.txt

      - name: Verify Apache package metadata and bundled notices
        run: |
          .\build\offline-build\Scripts\pip.exe wheel --no-deps --no-build-isolation --wheel-dir build\package-check .
          .\build\offline-build\Scripts\python.exe packaging\verify_wheel_license.py build\package-check

      - name: Generate constrained Windows metadata
        id: version
        shell: pwsh
        run: |
          $version = & .\build\offline-build\Scripts\python.exe packaging\write_version_info.py --print-signing-version
          "signing-version=$version" >> $env:GITHUB_OUTPUT

      - name: Build one-file executable
        run: .\build\offline-build\Scripts\pyinstaller.exe packaging\starcompanion.spec

      - name: Verify constrained Windows metadata
        shell: pwsh
        run: |
          $expectedVersion = "${{ steps.version.outputs.signing-version }}"
          $expected = @{
            "StarCompanion.exe" = "StarCompanion.exe"
            "starcompanion-cli.exe" = "starcompanion-cli.exe"
          }
          foreach ($name in $expected.Keys) {
            $info = (Get-Item -LiteralPath "dist\$name").VersionInfo
            if ($info.ProductName -ne "StarCompanion" -or
                $info.ProductVersion -ne $expectedVersion -or
                $info.FileVersion -ne $expectedVersion -or
                $info.CompanyName -ne "StarCompanion contributors" -or
                $info.OriginalFilename -ne $expected[$name]) {
              throw "Unexpected Windows version metadata for $name"
            }
          }

      # Run the built CLI itself, not the source: this proves the frozen
      # bundle can find its templates and profiles.
      - name: Smoke test the built CLI
        run: |
          .\dist\starcompanion-cli.exe profiles
          .\dist\starcompanion-cli.exe --help
          python packaging\smoke_fixture.py build\smoke-install\LIVE
          .\dist\starcompanion-cli.exe import --install build\smoke-install\LIVE --out build\smoke-cache.json

      - name: Verify packaged workflow with network access denied
        run: |
          .\build\offline-build\Scripts\python.exe packaging\collect_licenses.py
          python packaging\verify_offline.py --manifest dist\release-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload-windows
        with:
          name: StarCompanion-windows-unsigned
          path: |
            dist/StarCompanion.exe
            dist/starcompanion-cli.exe
            dist/release-manifest.json
            dist/THIRD_PARTY_LICENSES.txt
            sbom/starcompanion-runtime.cdx.json
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  build-ubuntu:
    needs: [test, supply-chain]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/build.txt

      - name: Install frozen GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Download hash-verified release wheelhouse
        run: >-
          pip download --require-hashes --only-binary=:all:
          --dest build/wheelhouse -r requirements/build.txt

      - name: Prove release dependencies install without an index
        run: |
          python -m venv build/offline-build
          build/offline-build/bin/pip install --no-index --find-links build/wheelhouse --require-hashes -r requirements/build.txt

      - name: Verify Apache package metadata and bundled notices
        run: |
          build/offline-build/bin/pip wheel --no-deps --no-build-isolation --wheel-dir build/package-check .
          build/offline-build/bin/python packaging/verify_wheel_license.py build/package-check

      - name: Build one-file executables
        run: build/offline-build/bin/pyinstaller packaging/starcompanion.spec

      - name: Smoke test the built CLI
        run: |
          dist/starcompanion-cli profiles
          dist/starcompanion-cli --help
          python packaging/smoke_fixture.py build/smoke-install/LIVE
          dist/starcompanion-cli import --install build/smoke-install/LIVE --out build/smoke-cache.json

      - name: Verify packaged GUI and core workflow with network access denied
        run: |
          build/offline-build/bin/python packaging/collect_licenses.py
          python packaging/verify_offline.py --manifest dist/release-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: StarCompanion-ubuntu-unsigned
          path: |
            dist/StarCompanion
            dist/starcompanion-cli
            dist/release-manifest.json
            dist/THIRD_PARTY_LICENSES.txt
            sbom/starcompanion-runtime.cdx.json
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  signpath-release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    needs: build-windows
    runs-on: windows-latest
    environment: release-signing
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Submit protected SignPath signing request
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ needs.build-windows.outputs.signing-version }}"

      - name: Independently verify publisher, timestamp, and signed bytes
        shell: pwsh
        run: ./packaging/report_signpath.ps1

      - name: Smoke and bind the signed artifacts to the release manifest
        run: >-
          python packaging\verify_offline.py
          --gui signed\dist\StarCompanion.exe
          --cli signed\dist\starcompanion-cli.exe
          --sbom signed\sbom\starcompanion-runtime.cdx.json
          --license signed\LICENSE
          --notice signed\NOTICE
          --third-party-licenses signed\dist\THIRD_PARTY_LICENSES.txt
          --authenticode-report signed\dist\authenticode-report.json
          --manifest signed\dist\release-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: StarCompanion-windows-signed
          path: |
            signed/dist/StarCompanion.exe
            signed/dist/starcompanion-cli.exe
            signed/dist/release-manifest.json
            signed/dist/authenticode-report.json
            signed/dist/THIRD_PARTY_LICENSES.txt
            signed/sbom/starcompanion-runtime.cdx.json
            signed/LICENSE
            signed/NOTICE
            signed/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
