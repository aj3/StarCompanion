[project]
name = "starcompanion"
version = "0.2.0"
description = "Datamine Star Citizen contract data and build a customizable global.ini localization override"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "PySide6==6.11.0",
    "Jinja2==3.1.6",
    "pydantic==2.13.4",
    "zstandard==0.25.0",
    "cryptography==50.0.0",
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
starcompanion = "starcompanion.__main__:main"

[project.gui-scripts]
starcompanion-gui = "starcompanion.gui.app:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
starcompanion = ["templates/**/*.j2", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
