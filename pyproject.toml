[project]
name = "starcompanion"
version = "0.3.0"
description = "Datamine Star Citizen contract data and build a customizable global.ini localization override"
readme = "README.md"
authors = [{ name = "aj3" }]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "COPYRIGHT",
    "THIRD_PARTY_NOTICES.md",
    "licenses/GPL-3.0-only.txt",
    "licenses/LGPL-3.0-only.txt",
    "licenses/PSF-2.0.txt",
]

dependencies = [
    "PySide6==6.11.0",
    "Jinja2==3.1.6",
    "pydantic==2.13.4",
    "zstandard==0.25.0",
    "cryptography==50.0.0",
    "tzdata==2026.3",
]

[project.urls]
Homepage = "https://github.com/aj3/StarCompanion"
Repository = "https://github.com/aj3/StarCompanion"
Issues = "https://github.com/aj3/StarCompanion/issues"
Documentation = "https://github.com/aj3/StarCompanion#readme"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
starcompanion = "starcompanion.__main__:main"

[project.gui-scripts]
starcompanion-gui = "starcompanion.gui.app:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
starcompanion = ["templates/**/*.j2", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
